<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flower Kanban</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F7F4FA;--pn:#fff;--ink:#2B1B3A;--mu:#6E6479;--ln:#DDD5E6;--ac:#2F5D46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#19131F;--pn:#241B2E;--ink:#F1EBF7;--mu:#A89CB5;--ln:#3A2F47;--ac:#8FC4A5}}
:root[data-theme="dark"]{--bg:#19131F;--pn:#241B2E;--ink:#F1EBF7;--mu:#A89CB5;--ln:#3A2F47;--ac:#8FC4A5}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.4 'Bricolage Grotesque',system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:12px;flex-wrap:wrap}
h1{font-size:21px;font-weight:800;margin:0 8px 0 0;letter-spacing:-.01em}
h2{font-size:14px;font-weight:600;margin:0 0 8px}
.sp{flex:1}
button,input,select{font:inherit;color:inherit}
button,select,#name{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{flex:1;min-height:0;display:grid;grid-template-columns:272px minmax(0,1fr) 248px;gap:12px;padding:0 12px 12px}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px;overflow:auto;min-height:0}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.card{border:1px solid var(--ln);border-radius:10px;padding:6px;text-align:center;cursor:grab;user-select:none;font-size:13px}
.card:hover{border-color:var(--ac)}
.pv img{width:100%;height:84px;object-fit:contain;display:block;pointer-events:none}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;padding:0;border:2px solid var(--pn);box-shadow:0 0 0 1px var(--ln)}
.dot.on{box-shadow:0 0 0 2px var(--ac)}
#stage{display:flex;flex-direction:column;gap:8px;min-height:0}
#cv{position:relative;flex:1;border-radius:14px;overflow:hidden;border:1px solid var(--ln);min-height:300px;touch-action:none}
#layer{position:absolute;inset:0}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#6E6479;pointer-events:none}
.it{position:absolute;pointer-events:none;cursor:grab;transform-origin:50% 85%}
.it[data-k="v"]{transform-origin:50% 50%}
.it svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.it img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.it.sel{outline:2px dashed #2F5D46;box-shadow:0 0 0 3px rgba(255,255,255,.75);border-radius:6px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.sw{width:26px;height:26px;border-radius:50%;padding:0}.sw.on{box-shadow:0 0 0 2px var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
input[type=range]{width:100%;display:block;accent-color:var(--ac)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.danger{color:#B3261E}
.mu{color:var(--mu);font-size:13px;margin:0}
ul{margin:0;padding-left:18px}li{margin-bottom:4px}
.ghost{position:fixed;z-index:99;width:60px;transform:translate(-50%,-50%);opacity:.85;pointer-events:none}
.ghost img{width:100%;height:auto;display:block}
#side{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
@media(max-width:860px){html,body{height:auto}main{display:flex;flex-direction:column}#stage{order:-1}#cv{height:62vh;flex:none}.row{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Flower Kanban</h1>
  <input id="name" aria-label="Board name">
  <select id="boards" aria-label="Saved boards"></select>
  <button id="new">New board</button>
  <span class="sp"></span>
  <button id="un">Undo</button><button id="re">Redo</button><button id="clr">Clear board</button>
</header>
<main>
  <aside id="lib" class="pn" aria-label="Flower and vase library"></aside>
  <section id="stage">
    <div id="cv"><div id="layer"></div><div id="empty">Drag a vase or flower onto the board, or tap one in the library.</div></div>
    <div id="bar"><span>Background</span><span id="bgs" style="display:flex;gap:6px"></span><label style="margin:0 0 0 12px">New flowers go <select id="tuck"><option value="1">behind vases</option><option value="0">in front of vases</option></select></label></div>
  </section>
  <aside id="side"><div id="insp" class="pn"></div><div id="list" class="pn"></div></aside>
</main>

  layer.querySelectorAll('.it').forEach(x=>x.classList.toggle('sel',x==el));renderPanels();
  const sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y;let moved=false;
  const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<4)return;if(!moved){snap();moved=true}it.x=Math.round(ox+ev.clientX-sx);it.y=Math.round(oy+ev.clientY-sy);place(el,it)};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(moved)save()};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
});
const insp=$('#insp');
insp.addEventListener('input',e=>{const it=items.find(i=>i.id==sel);if(!it||e.target.type!='range')return;if(!dirty){snap();dirty=true}if(e.target.id=='sz')it.w=+e.target.value;else it.r=+e.target.value;place(layer.children[items.indexOf(it)],it)});
insp.addEventListener('change',e=>{if(e.target.type=='range'){dirty=false;save()}});
insp.addEventListener('click',e=>{
  const it=items.find(i=>i.id==sel),b=e.target.closest('button');if(!it||!b)return;
  const i=items.indexOf(it);snap();const a=b.dataset.a;
  if(a=='flip')it.f=!it.f;
  else if(a=='fwd'&&i<items.length-1)[items[i],items[i+1]]=[items[i+1],items[i]];
  else if(a=='back'&&i>0)[items[i],items[i-1]]=[items[i-1],items[i]];
  else if(a=='behind'||a=='front'){const vs=items.filter(v=>AS[v.t].k=='v');if(vs.length){const v=vs.reduce((m,c)=>Math.abs(c.x-it.x)<Math.abs(m.x-it.x)?c:m);items.splice(i,1);const vi=items.indexOf(v);items.splice(a=='behind'?vi:vi+1,0,it)}}
  else if(a=='dup'){const d={...it,id:uid++,x:it.x+24,y:it.y+24};items.splice(i+1,0,d);sel=d.id}
  else if(a=='del'){items.splice(i,1);sel=null}
  render();save();
});
$('#un').onclick=()=>{if(!undo.length)return;redo.push(snapshot());restore(undo.pop());render();save()};
$('#re').onclick=()=>{if(!redo.length)return;undo.push(snapshot());restore(redo.pop());render();save()};
$('#clr').onclick=()=>{if(!items.length)return;snap();items=[];sel=null;render();save()};
$('#new').onclick=()=>{let n=1;while(boards['Bouquet '+n])n++;boards['Bouquet '+n]={items:[],bg};openBoard('Bouquet '+n);save()};
$('#boards').onchange=e=>{save();openBoard(e.target.value);save()};
$('#name').onchange=e=>{const n=e.target.value.trim();if(!n||boards[n]){e.target.value=cur;return}boards[n]=boards[cur];delete boards[cur];cur=n;fillBoards();save()};
$('#bgs').addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b)return;snap();bg=b.dataset.bg;render();save()});
$('#tuck').onchange=e=>{tuck=e.target.value=='1'};
addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const it=items.find(i=>i.id==sel),mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()=='z'){e.preventDefault();(e.shiftKey?$('#re'):$('#un')).click();return}
  if(!it)return;
  if(e.key=='Delete'||e.key=='Backspace'){snap();items.splice(items.indexOf(it),1);sel=null;render();save()}
  else if(e.key.startsWith('Arrow')){e.preventDefault();const s=e.shiftKey?10:2;it.x+=e.key=='ArrowRight'?s:e.key=='ArrowLeft'?-s:0;it.y+=e.key=='ArrowDown'?s:e.key=='ArrowUp'?-s:0;place(layer.children[items.indexOf(it)],it);save()}
});
try{const d=JSON.parse(localStorage.getItem('fk2')||'null');if(d&&d.boards){boards=d.boards;cur=d.cur}}catch(e){}
if(!cur||!boards[cur]){cur='My first bouquet';boards[cur]={items:[],bg:'Linen'}}
buildLib();openBoard(cur);

</script>
</body>
</html>
